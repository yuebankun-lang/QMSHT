<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>摄像头诊断页 2 · 图层实验</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: sans-serif; }
    #ui { position: fixed; left: 0; right: 0; top: 0; z-index: 99; padding: 10px; box-sizing: border-box; }
    button { font-size: 15px; padding: 11px 14px; margin: 0 8px 8px 0; border-radius: 8px; border: none; background: #e8c87e; color: #222; }
    #log {
      background: rgba(0,0,0,.78); color: #b6ffb0; font-size: 12px; line-height: 1.55;
      padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-all;
      max-height: 40vh; overflow-y: auto; margin: 0;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btnStart">1：启动 AR 相机</button>
    <button id="btnA">2 实验A：相机提顶层</button>
    <button id="btnB">3 实验B：画布变透明</button>
    <pre id="log">图层实验（按 1 → 2 → 3 顺序点，每点一次看一眼画面出没出来）</pre>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane color="#ffcc00" width="1" height="0.64" position="0 0 0.01"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const logEl = document.getElementById('log');
    const t0 = Date.now();
    function log(msg) {
      logEl.textContent += '\n[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.addEventListener('error', (e) => log('页面报错: ' + e.message));

    const sceneEl = document.querySelector('a-scene');
    document.getElementById('target').addEventListener('targetFound', () => log('★ targetFound 扫到了！'));

    sceneEl.addEventListener('renderstart', () => {
      try { log('画布初始透明度 clearAlpha = ' + sceneEl.renderer.getClearAlpha()); } catch (e) {}
    });

    function mindarVideo() {
      // MindAR 的相机 video：没有 id 的那个
      return Array.from(document.querySelectorAll('video')).find((v) => !v.id) || null;
    }

    document.getElementById('btnStart').addEventListener('click', async () => {
      log('启动 MindAR…');
      try {
        await sceneEl.systems['mindar-image-system'].start();
        log('✓ start() 成功。等 2 秒看画面：没出来就点实验A');
      } catch (e) {
        log('✗ start() 报错: ' + (e && (e.name + ' ' + e.message)));
      }
    });

    document.getElementById('btnA').addEventListener('click', () => {
      const v = mindarVideo();
      if (!v) { log('实验A：没找到相机 video'); return; }
      v.style.position = 'fixed';
      v.style.inset = '0';
      v.style.width = '100%';
      v.style.height = '100%';
      v.style.objectFit = 'cover';
      v.style.zIndex = '999';
      log('实验A 已执行：相机画面提到最顶层。★ 现在画面出来了吗？出来了就不用点实验B，直接告诉我');
    });

    document.getElementById('btnB').addEventListener('click', () => {
      try {
        sceneEl.renderer.setClearColor(0x000000, 0);
        if (sceneEl.canvas) sceneEl.canvas.style.background = 'transparent';
        log('实验B 已执行：画布清屏透明度设为 0，现在 clearAlpha = ' + sceneEl.renderer.getClearAlpha() + '。★ 画面出来了吗？');
      } catch (e) {
        log('实验B 报错: ' + e.message);
      }
    });
  </script>
</body>
</html>
